[project]
name = "solar-studio"
version = "0.1.0"
description = "Solar planning and document-grounded AI showcase"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pgvector>=0.4",
  "pydantic-settings>=2.7",
  "email-validator>=2.2",
  "python-multipart>=0.0.20",
  "argon2-cffi>=23.1",
  "PyJWT>=2.10",
  "httpx>=0.28",
  "pandas>=2.2",
  "pvlib>=0.13",
  "openai>=1.76",
  "pypdf>=5.0",
  "reportlab>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.9"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "UP017"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

